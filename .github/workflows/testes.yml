name: Testes

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres temporário: nasce vazio a cada execução e some no fim. Nunca o de produção.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crisducorte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crisducorte_test
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # O next build só confere os tipos do app; aqui entram também tests/ e e2e/.
      - name: Tipos (tsc)
        run: npx tsc --noEmit

      - name: Testes de unidade
        run: npm run test:unit

      - name: Testes de integração (Postgres temporário)
        run: npm run test:int

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NEXTAUTH_SECRET: ci-secret-nao-usar-em-producao
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes no navegador (e2e)
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
